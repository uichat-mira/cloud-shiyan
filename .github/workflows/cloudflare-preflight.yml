name: Cloudflare preflight

on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-preflight
    paths:
      - .github/workflows/cloudflare-preflight.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify shared Cloudflare credentials are visible
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "CLOUDFLARE_API_TOKEN is not visible to this repository"; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "CLOUDFLARE_ACCOUNT_ID is not visible to this repository"; exit 1; }
          echo "Shared Cloudflare credentials are visible to cloud-shiyan." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Inspect Shiyan Cloudflare resources (read only)
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"

          say() {
            printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          cf_get() {
            local path="$1"
            local out="$2"
            local code
            code=$(curl -sS -o "$out" -w '%{http_code}' \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              "${API}${path}")
            echo "$code"
          }

          report_failure() {
            local title="$1"
            local code="$2"
            local file="$3"
            say "### ${title}"
            say "Read failed (HTTP ${code})."
            jq -r '.errors[]? | "- Cloudflare error \(.code): \(.message)"' "$file" | tee -a "$GITHUB_STEP_SUMMARY" || true
            say ""
          }

          say "## Shiyan Cloudflare read-only preflight"
          say ""

          workers_code=$(cf_get "/accounts/${ACCOUNT}/workers/scripts" /tmp/workers.json)
          if [ "$workers_code" = "200" ] && [ "$(jq -r '.success' /tmp/workers.json)" = "true" ]; then
            say "### Workers"
            jq -r '.result[] | select((.id // "") | test("shiyan"; "i")) | "- `\(.id)` — modified `\(.modified_on // "unknown")`, deployed from `\(.last_deployed_from // "unknown")`"' /tmp/workers.json | tee -a "$GITHUB_STEP_SUMMARY"
            if ! jq -e '.result[] | select((.id // "") | test("shiyan"; "i"))' /tmp/workers.json >/dev/null; then
              say '- No Worker with `shiyan` in its name was found.'
            fi
            say ""
          else
            report_failure "Workers" "$workers_code" /tmp/workers.json
          fi

          d1_code=$(cf_get "/accounts/${ACCOUNT}/d1/database?name=mira-shiyan" /tmp/d1.json)
          if [ "$d1_code" = "200" ] && [ "$(jq -r '.success' /tmp/d1.json)" = "true" ]; then
            say "### D1"
            jq -r '.result[]? | "- `\(.name)` — uuid `\(.uuid)`"' /tmp/d1.json | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(jq '.result | length' /tmp/d1.json)" = "0" ]; then say '- `mira-shiyan` not found.'; fi
            say ""
          else
            report_failure "D1" "$d1_code" /tmp/d1.json
          fi

          r2_code=$(cf_get "/accounts/${ACCOUNT}/r2/buckets?name_contains=mira-shiyan" /tmp/r2.json)
          if [ "$r2_code" = "200" ] && [ "$(jq -r '.success' /tmp/r2.json)" = "true" ]; then
            say "### R2"
            jq -r '.result.buckets[]? | "- `\(.name)` — created `\(.creation_date // "unknown")`"' /tmp/r2.json | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(jq '.result.buckets | length' /tmp/r2.json)" = "0" ]; then say '- No matching Shiyan bucket found.'; fi
            say ""
          else
            report_failure "R2" "$r2_code" /tmp/r2.json
          fi

          workflows_code=$(cf_get "/accounts/${ACCOUNT}/workflows?search=shiyan&per_page=100" /tmp/workflows.json)
          if [ "$workflows_code" = "200" ] && [ "$(jq -r '.success' /tmp/workflows.json)" = "true" ]; then
            say "### Workflows"
            jq -r '.result[]? | "- `\(.name)` — script `\(.script_name)`, class `\(.class_name)`"' /tmp/workflows.json | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(jq '.result | length' /tmp/workflows.json)" = "0" ]; then say '- No matching Shiyan Workflow found.'; fi
            say ""
          else
            report_failure "Workflows" "$workflows_code" /tmp/workflows.json
          fi

          domains_code=$(cf_get "/accounts/${ACCOUNT}/workers/domains" /tmp/domains.json)
          if [ "$domains_code" = "200" ] && [ "$(jq -r '.success' /tmp/domains.json)" = "true" ]; then
            say "### Worker custom domains"
            jq -r '.result[]? | select((.service // "") | test("shiyan"; "i")) | "- `\(.hostname)` -> `\(.service)` (zone `\(.zone_name)`)"' /tmp/domains.json | tee -a "$GITHUB_STEP_SUMMARY"
            if ! jq -e '.result[]? | select((.service // "") | test("shiyan"; "i"))' /tmp/domains.json >/dev/null; then
              say '- No Shiyan custom domain found.'
            fi
            say ""
          else
            report_failure "Worker custom domains" "$domains_code" /tmp/domains.json
          fi

          for worker in mira-shiyan-api mira-shiyan-llm; do
            if jq -e --arg worker "$worker" '.result[]? | select(.id == $worker)' /tmp/workers.json >/dev/null 2>&1; then
              settings_code=$(cf_get "/accounts/${ACCOUNT}/workers/scripts/${worker}/settings" "/tmp/${worker}-settings.json")
              say "### ${worker} binding names"
              if [ "$settings_code" = "200" ] && [ "$(jq -r '.success' "/tmp/${worker}-settings.json")" = "true" ]; then
                jq -r '.result.bindings[]? | "- `\(.name // .binding // "unnamed")` — `\(.type // "unknown")`"' "/tmp/${worker}-settings.json" | tee -a "$GITHUB_STEP_SUMMARY"
              else
                say "- Settings read failed (HTTP ${settings_code})."
              fi
              say ""
            fi
          done

          say "Preflight used GET requests only; it did not deploy, mutate routes, or change resources."
