name: Cloud Shiyan legacy-source A/B preview

on:
  push:
    branches: [fix/shiyan-cutover-auth-preview]
    paths:
      - '.github/workflows/cutover-legacy-ab.yml'

permissions:
  contents: read

jobs:
  legacy-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact legacy production source
        uses: actions/checkout@v4
        with:
          repository: dangjingtao/mira-shiyan-cloud
          ref: 03e8c12db80c1f879da2aabf268d5b5e0769c01a
          path: legacy

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Build legacy non-production version config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'legacy/wrangler.api.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.preview_urls = true;
          const db = config.d1_databases?.find((binding) => binding.binding === 'DB');
          if (!db) throw new Error('DB binding missing');
          db.database_id = '5f923203-bb4f-40a1-9b83-d6cf493f3114';
          fs.writeFileSync('legacy/wrangler.legacy-preview.json', JSON.stringify(config, null, 2));
          NODE

      - name: Install legacy dependencies
        working-directory: legacy
        run: npm install --no-audit --no-fund

      - name: Upload exact legacy source as version only
        working-directory: legacy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions upload \
            --preview-alias shiyan-legacy-ab \
            -c wrangler.legacy-preview.json | tee /tmp/legacy-upload.log
          grep -E 'Worker Version ID:' /tmp/legacy-upload.log
          echo 'No production deployment performed.'

      - name: Smoke legacy Version URL boundary
        shell: bash
        run: |
          set -euo pipefail
          preview='https://shiyan-legacy-ab-mira-shiyan-api.dangjingtao.workers.dev'
          sleep 3
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$preview/health")
          unauth_code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$preview/v1/capture-tasks")
          echo "health_status=$health_code"
          echo "unauth_status=$unauth_code"
          cat /tmp/health.json
          echo
          test "$health_code" = '200'
          test "$unauth_code" = '401'
          echo "Legacy A/B URL: $preview"
