name: Cloud Shiyan pepper A/B diagnostic

on:
  push:
    branches: [fix/shiyan-cutover-auth-preview]
    paths:
      - '.github/workflows/cutover-pepper-ab.yml'

permissions:
  contents: read

jobs:
  pepper-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Generate runtime-only probe material
        shell: bash
        run: |
          set -euo pipefail
          probe_token="$(openssl rand -hex 32)"
          probe_credential="cutover-probe-$(openssl rand -hex 32)"
          expires_at="$(date -u -d '+10 minutes' +'%Y-%m-%dT%H:%M:%SZ')"
          echo "::add-mask::$probe_token"
          echo "::add-mask::$probe_credential"
          {
            echo "CUTOVER_PROBE_TOKEN=$probe_token"
            echo "CUTOVER_PROBE_CREDENTIAL=$probe_credential"
            echo "CUTOVER_PROBE_EXPIRES_AT=$expires_at"
          } >> "$GITHUB_ENV"

      - name: Build probe preview config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          config.vars = {
            ...(config.vars ?? {}),
            CUTOVER_PROBE_TOKEN: process.env.CUTOVER_PROBE_TOKEN,
            CUTOVER_PROBE_EXPIRES_AT: process.env.CUTOVER_PROBE_EXPIRES_AT,
          };
          fs.writeFileSync('wrangler.pepper-ab.json', JSON.stringify(config, null, 2));
          NODE

      - name: Validate and upload probe candidate
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run -c wrangler.pepper-ab.json
          npx wrangler versions upload --preview-alias shiyan-pepper-ab -c wrangler.pepper-ab.json | tee /tmp/upload.log
          version_id="$(sed -n 's/.*Worker Version ID: //p' /tmp/upload.log | tail -n1)"
          test -n "$version_id"
          echo "CUTOVER_PROBE_VERSION=$version_id" >> "$GITHUB_ENV"
          echo "Worker Version ID: $version_id"
          echo "No production deployment performed."

      - name: Provision one ephemeral probe device with candidate pepper
        shell: bash
        run: |
          set -euo pipefail
          preview='https://shiyan-pepper-ab-mira-shiyan-api.dangjingtao.workers.dev'
          sleep 3
          jq -n --arg credential "$CUTOVER_PROBE_CREDENTIAL"             '{credential:$credential}' > /tmp/provision-body.json
          code=$(curl -sS -o /tmp/provision.json -w '%{http_code}'             -H 'Content-Type: application/json'             -H "X-Cutover-Probe-Token: $CUTOVER_PROBE_TOKEN"             --data-binary @/tmp/provision-body.json             "$preview/__cutover/probe-device")
          echo "provision_status=$code"
          test "$code" = '200'
          device_id=$(jq -r '.data.deviceId // empty' /tmp/provision.json)
          test -n "$device_id"
          echo "CUTOVER_PROBE_DEVICE_ID=$device_id" >> "$GITHUB_ENV"

      - name: Compare candidate and production auth against the same D1 row
        shell: bash
        run: |
          set -euo pipefail
          preview='https://shiyan-pepper-ab-mira-shiyan-api.dangjingtao.workers.dev'
          production='https://shiyan-api.tomz.io'

          candidate_code=$(curl -sS -o /tmp/candidate.json -w '%{http_code}'             -H "Authorization: Bearer $CUTOVER_PROBE_CREDENTIAL"             "$preview/v1/scenes")
          production_code=$(curl -sS -o /tmp/production.json -w '%{http_code}'             -H "Authorization: Bearer $CUTOVER_PROBE_CREDENTIAL"             "$production/v1/scenes")

          echo "candidate_auth_status=$candidate_code"
          echo "production_auth_status=$production_code"

          test "$candidate_code" = '200'

          if [ "$production_code" = '200' ]; then
            echo 'PEPPER_AB_RESULT=SAME'
          elif [ "$production_code" = '401' ]; then
            echo 'PEPPER_AB_RESULT=DIFFERENT'
          else
            echo "::error::Unexpected production auth status: $production_code"
            exit 1
          fi

      - name: Cleanup ephemeral probe device
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CUTOVER_PROBE_DEVICE_ID:-}" ]; then
            echo 'No probe device to clean up.'
            exit 0
          fi
          preview='https://shiyan-pepper-ab-mira-shiyan-api.dangjingtao.workers.dev'
          jq -n --arg deviceId "$CUTOVER_PROBE_DEVICE_ID"             '{deviceId:$deviceId}' > /tmp/cleanup-body.json
          code=$(curl -sS -o /tmp/cleanup.json -w '%{http_code}'             -X DELETE             -H 'Content-Type: application/json'             -H "X-Cutover-Probe-Token: $CUTOVER_PROBE_TOKEN"             --data-binary @/tmp/cleanup-body.json             "$preview/__cutover/probe-device")
          echo "cleanup_status=$code"
          test "$code" = '200'
