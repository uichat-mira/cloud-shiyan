name: Cloud Shiyan cutover readiness

on:
  push:
    branches:
      - feat/cutover-readiness
    paths:
      - .github/workflows/cutover-readiness.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ORG_LLM_PRIMARY_API_KEY: ${{ secrets.LLM_PRIMARY_API_KEY }}
      ORG_DEVICE_AUTH_PEPPER: ${{ secrets.DEVICE_AUTH_PEPPER }}
      ORG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      ORG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      ORG_GITHUB_DESTINATION_TOKEN: ${{ secrets.GITHUB_DESTINATION_TOKEN }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - name: Check reusable GitHub secrets without exposing values
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              echo "${name}=PRESENT"
            else
              echo "${name}=MISSING"
            fi
          }

          check CLOUDFLARE_API_TOKEN "${CLOUDFLARE_API_TOKEN:-}"
          check CLOUDFLARE_ACCOUNT_ID "${CLOUDFLARE_ACCOUNT_ID:-}"
          check LLM_PRIMARY_API_KEY "${ORG_LLM_PRIMARY_API_KEY:-}"
          check DEVICE_AUTH_PEPPER "${ORG_DEVICE_AUTH_PEPPER:-}"
          check R2_ACCESS_KEY_ID "${ORG_R2_ACCESS_KEY_ID:-}"
          check R2_SECRET_ACCESS_KEY "${ORG_R2_SECRET_ACCESS_KEY:-}"
          check GITHUB_DESTINATION_TOKEN "${ORG_GITHUB_DESTINATION_TOKEN:-}"

      - name: Check legacy Cloudflare binding availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"

          for worker in mira-shiyan-api mira-shiyan-llm; do
            file="/tmp/${worker}.json"
            code=$(curl -sS -o "$file" -w '%{http_code}' \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              "${API}/accounts/${ACCOUNT}/workers/scripts/${worker}/settings")
            echo "${worker}: settings HTTP ${code}"
            if [ "$code" != "200" ] || [ "$(jq -r '.success' "$file")" != "true" ]; then
              jq -r '.errors[]? | "Cloudflare error \(.code): \(.message)"' "$file" || true
              continue
            fi

            if [ "$worker" = "mira-shiyan-llm" ]; then
              jq -r '.result.bindings[]? | select((.name // "") | startswith("LLM_")) | "  \(.name)=PRESENT type=\(.type)"' "$file"
            else
              jq -r '.result.bindings[]? | select((.name // "") | test("^(DEVICE_AUTH_PEPPER|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|GITHUB_DESTINATION_TOKEN)$")) | "  \(.name)=PRESENT type=\(.type)"' "$file"
            fi
          done

          echo "Readiness check used GET requests only and printed names/presence, never secret values."

      - name: Capture current deployment and version rollback anchors
        shell: bash
        run: |
          set -euo pipefail
          for worker in mira-shiyan-api mira-shiyan-llm; do
            echo "=== ${worker} current deployment ==="
            npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "$worker" --json
            echo "=== ${worker} recent versions ==="
            npx --yes wrangler@${WRANGLER_VERSION} versions list --name "$worker" --json | jq '.[0:3] | map({id, created_on, source, tag, message})'
          done
