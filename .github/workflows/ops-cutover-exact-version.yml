name: Cloud Shiyan exact-version production cutover
# one-shot trigger via audited prod PR merge

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: cloud-shiyan-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    if: ${{ github.event.head_commit.message == 'ops: cut over Shiyan exact version 4b039f12' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
      WORKER_NAME: mira-shiyan-api
      TARGET_VERSION: 4b039f12-0bdc-433a-9553-00ad72a28426
      ROLLBACK_VERSION: 720f2952-78d3-4d61-848b-8f82b956e498
    steps:
      - name: Validate deployment authority and exact versions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npx --yes wrangler@${WRANGLER_VERSION} versions list --name "${WORKER_NAME}" --json > /tmp/versions.json
          grep -Fq "${TARGET_VERSION}" /tmp/versions.json
          grep -Fq "${ROLLBACK_VERSION}" /tmp/versions.json
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "${WORKER_NAME}" --json > /tmp/before.json
          echo "Pre-cutover deployment status:"
          cat /tmp/before.json

      - name: Promote exact reviewed version to 100 percent
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${TARGET_VERSION}@100%" \
            --name "${WORKER_NAME}" \
            --message "Cloud Shiyan Organization cutover #3" \
            -y

      - name: Verify exact production deployment and T5 boundary
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "${WORKER_NAME}" --json > /tmp/after.json
          echo "Post-cutover deployment status:"
          cat /tmp/after.json
          grep -Fq "${TARGET_VERSION}" /tmp/after.json

          ok=0
          for attempt in 1 2 3 4 5 6; do
            health_code=$(curl -sS --max-time 15 -o /tmp/health.json -w '%{http_code}' https://shiyan-api.tomz.io/health || true)
            unauth_code=$(curl -sS --max-time 15 -o /tmp/unauth.json -w '%{http_code}' https://shiyan-api.tomz.io/v1/scenes || true)
            echo "attempt=${attempt} health=${health_code} unauth=${unauth_code}"
            if [ "${health_code}" = "200" ] \
              && jq -e '.ok == true and .data.service == "mira-shiyan"' /tmp/health.json >/dev/null 2>&1 \
              && [ "${unauth_code}" = "401" ] \
              && jq -e '.ok == false and .error.code == "device_unauthorized"' /tmp/unauth.json >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 5
          done
          test "${ok}" = "1"

      - name: Roll back automatically if production T5 fails
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::Production T5 failed; restoring rollback version ${ROLLBACK_VERSION}"
          npx --yes wrangler@${WRANGLER_VERSION} versions deploy "${ROLLBACK_VERSION}@100%" \
            --name "${WORKER_NAME}" \
            --message "Automatic rollback after Cloud Shiyan cutover T5 failure" \
            -y
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name "${WORKER_NAME}" --json > /tmp/rollback.json
          cat /tmp/rollback.json
          grep -Fq "${ROLLBACK_VERSION}" /tmp/rollback.json
