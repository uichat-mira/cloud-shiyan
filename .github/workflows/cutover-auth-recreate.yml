name: Cloud Shiyan auth candidate recreate

on:
  push:
    branches: [fix/shiyan-cutover-auth-preview]
    paths:
      - '.github/workflows/cutover-auth-recreate.yml'
      - 'wrangler.jsonc'
      - 'src/**'
      - 'migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'vitest.config.ts'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  recreate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Build preview config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          fs.writeFileSync('wrangler.preview.json', JSON.stringify(config, null, 2));
          NODE

      - name: Validate source and required secret declarations
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run -c wrangler.preview.json

      - name: Upload a fresh non-production auth candidate
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --preview-alias shiyan-cutover-auth -c wrangler.preview.json | tee /tmp/upload.log
          version_id="$(sed -n 's/.*Worker Version ID: //p' /tmp/upload.log | tail -n1)"
          test -n "$version_id"
          echo "candidate_version=$version_id" >> "$GITHUB_OUTPUT"
          echo "Worker Version ID: $version_id"
          echo "No production deployment performed."
        id: upload

      - name: Smoke public boundary
        shell: bash
        run: |
          set -euo pipefail
          preview='https://shiyan-cutover-auth-mira-shiyan-api.dangjingtao.workers.dev'
          sleep 3
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$preview/health")
          unauth_code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$preview/v1/capture-tasks")
          header_code=$(curl -sS -o /tmp/header.json -w '%{http_code}' \
            -H 'Authorization: Bearer cutover-header-probe' \
            "$preview/__cutover/header-check")
          echo "health_status=$health_code"
          echo "unauth_status=$unauth_code"
          echo "header_status=$header_code"
          test "$health_code" = '200'
          jq -e '.ok == true and .data.service == "mira-shiyan"' /tmp/health.json >/dev/null
          test "$unauth_code" = '401'
          jq -e '.ok == false and .error.code == "device_unauthorized"' /tmp/unauth.json >/dev/null
          test "$header_code" = '200'
          jq -e '.ok == true and .data.authorizationPresent == true and .data.bearer == true' /tmp/header.json >/dev/null
          echo 'Version URL Authorization forwarding=PASS'
          echo "Preview URL: $preview"
