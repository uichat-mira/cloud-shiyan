name: Cloud Shiyan CI

on:
  pull_request:
  push:
    branches: [dev, test, prod]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run organization merge gate
        run: npm run check

      - name: Reject obsolete two-Worker topology
        run: |
          test ! -e wrangler.api.jsonc
          test ! -e wrangler.llm.jsonc
          ! grep -R "mira-shiyan-llm" src wrangler.jsonc
          ! grep -q '"services"' wrangler.jsonc
