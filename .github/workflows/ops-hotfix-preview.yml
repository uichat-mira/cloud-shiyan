name: Cloud Shiyan hotfix preview upload

on:
  push:
    branches: [prod]

permissions:
  contents: read

concurrency:
  group: cloud-shiyan-hotfix-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
      HOTFIX_COMMIT: ab9415c7a0463dd7147b0e2b83003600707d4d64
      HOTFIX_MARKER: 'ops: upload Shiyan hotfix preview ab9415c7'
    steps:
      - name: Guard one-shot marker
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          message="$(jq -r '.head_commit.message // ""' "$GITHUB_EVENT_PATH" | head -n1)"
          if [ "$message" != "$HOTFIX_MARKER" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the authorized hotfix upload marker."
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          ref: ${{ env.HOTFIX_COMMIT }}

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Use npm 11
        if: steps.guard.outputs.run == 'true'
        run: npm install --global npm@11

      - name: Build cutover-equivalent preview config
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          config.vars = {
            ...(config.vars ?? {}),
            R2_ACCOUNT_ID: process.env.CLOUDFLARE_ACCOUNT_ID,
            SHIYAN_LLM_CONFIG_REPAIR_SINGLE_MISSING_DOUBLE_QUOTE: '1',
          };
          fs.writeFileSync('wrangler.hotfix.json', JSON.stringify(config, null, 2));
          NODE

      - name: Validate source
        if: steps.guard.outputs.run == 'true'
        run: npm install --no-audit --no-fund && npm run typecheck && npm test && npx wrangler deploy --dry-run -c wrangler.hotfix.json

      - name: Upload hotfix version only
        if: steps.guard.outputs.run == 'true'
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions upload --preview-alias shiyan-hotfix -c wrangler.hotfix.json | tee /tmp/upload.log
          version_id="$(sed -n 's/.*Worker Version ID: //p' /tmp/upload.log | tail -n1)"
          preview_url="$(sed -n 's/.*Version Preview URL: //p' /tmp/upload.log | tail -n1)"
          test -n "$version_id"
          test -n "$preview_url"
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "HOTFIX_VERSION=$version_id"
          echo "HOTFIX_PREVIEW=$preview_url"

      - name: Smoke immutable preview boundary
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          preview="${{ steps.upload.outputs.preview_url }}"
          health_code="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$preview/health")"
          unauth_code="$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "$preview/v1/scenes")"
          echo "health_status=$health_code"
          echo "unauth_status=$unauth_code"
          test "$health_code" = "200"
          jq -e '.ok == true and .data.service == "mira-shiyan"' /tmp/health.json >/dev/null
          test "$unauth_code" = "401"
          jq -e '.ok == false and .error.code == "device_unauthorized"' /tmp/unauth.json >/dev/null
