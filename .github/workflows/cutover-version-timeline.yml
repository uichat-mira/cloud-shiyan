name: Cloud Shiyan version timeline diagnostic

on:
  push:
    branches: [fix/shiyan-cutover-auth-preview]
    paths:
      - '.github/workflows/cutover-version-timeline.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read current deployment status
        shell: bash
        run: |
          set -euo pipefail
          echo '--- deployments status ---'
          npx --yes wrangler@${WRANGLER_VERSION} deployments status --name mira-shiyan-api --json || true
          echo '--- deployments list ---'
          npx --yes wrangler@${WRANGLER_VERSION} deployments list --name mira-shiyan-api --json || true

      - name: List Worker versions
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions list --name mira-shiyan-api --json > /tmp/versions.json
          node <<'NODE'
          const fs = require('node:fs');
          const json = JSON.parse(fs.readFileSync('/tmp/versions.json', 'utf8'));
          const versions = Array.isArray(json) ? json : (json.result ?? json.versions ?? []);
          const rows = versions.map((v) => ({
            id: v.id ?? v.version_id ?? null,
            created_on: v.created_on ?? v.created_at ?? null,
            source: v.source ?? null,
            tag: v.tag ?? null,
            message: v.annotations?.['workers/message'] ?? v.message ?? null,
          }));
          console.log(JSON.stringify(rows, null, 2));
          NODE

      - name: Inspect each version binding names
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const json = JSON.parse(fs.readFileSync('/tmp/versions.json', 'utf8'));
          const versions = Array.isArray(json) ? json : (json.result ?? json.versions ?? []);
          for (const v of versions) {
            const id = v.id ?? v.version_id;
            if (id) console.log(id);
          }
          NODE
          > /tmp/version-ids.txt
          while read -r version_id; do
            test -n "$version_id" || continue
            npx --yes wrangler@${WRANGLER_VERSION} versions view "$version_id" --name mira-shiyan-api --json > /tmp/version.json
            VERSION_ID="$version_id" node <<'NODE'
          const fs = require('node:fs');
          const json = JSON.parse(fs.readFileSync('/tmp/version.json', 'utf8'));
          const names = [];
          function walk(node) {
            if (!node || typeof node !== 'object') return;
            if (Array.isArray(node)) {
              for (const item of node) walk(item);
              return;
            }
            for (const [key, value] of Object.entries(node)) {
              if (key === 'bindings' && Array.isArray(value)) {
                for (const binding of value) {
                  if (binding && typeof binding === 'object') {
                    names.push({ name: binding.name ?? null, type: binding.type ?? null });
                  }
                }
              } else {
                walk(value);
              }
            }
          }
          walk(json);
          console.log(JSON.stringify({
            id: process.env.VERSION_ID,
            bindings: names,
          }));
          NODE
          done < /tmp/version-ids.txt
