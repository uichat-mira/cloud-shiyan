name: Cloud Shiyan R2 host diagnostic

on:
  push:
    branches: [fix/shiyan-cutover-auth-preview]
    paths:
      - '.github/workflows/cutover-r2-host.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
      PROD_VERSION: '720f2952-78d3-4d61-848b-8f82b956e498'
      PREVIEW_VERSION: '8d1903a3-c810-49f2-a378-05f03c7790cd'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use npm 11
        run: npm install --global npm@11

      - name: Compare R2 account binding fingerprint
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@${WRANGLER_VERSION} versions view "$PROD_VERSION" --name mira-shiyan-api --json > /tmp/prod.json
          npx --yes wrangler@${WRANGLER_VERSION} versions view "$PREVIEW_VERSION" --name mira-shiyan-api --json > /tmp/preview.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');

          function findBinding(node, name) {
            if (!node || typeof node !== 'object') return null;
            if (Array.isArray(node)) {
              for (const item of node) {
                const hit = findBinding(item, name);
                if (hit) return hit;
              }
              return null;
            }
            if (Array.isArray(node.bindings)) {
              const hit = node.bindings.find((b) => b && b.name === name);
              if (hit) return hit;
            }
            for (const value of Object.values(node)) {
              const hit = findBinding(value, name);
              if (hit) return hit;
            }
            return null;
          }

          function extractValue(binding) {
            if (!binding || typeof binding !== 'object') return null;
            for (const key of ['text', 'value']) {
              if (typeof binding[key] === 'string') return binding[key];
            }
            return null;
          }

          function summarize(path) {
            const json = JSON.parse(fs.readFileSync(path, 'utf8'));
            const binding = findBinding(json, 'R2_ACCOUNT_ID');
            const value = extractValue(binding);
            return {
              present: Boolean(binding),
              type: binding?.type ?? null,
              length: value?.length ?? null,
              fingerprint: value
                ? crypto.createHash('sha256').update(value).digest('hex').slice(0, 12)
                : null,
            };
          }

          const prod = summarize('/tmp/prod.json');
          const preview = summarize('/tmp/preview.json');
          console.log(JSON.stringify({ prod, preview, same: prod.fingerprint === preview.fingerprint }, null, 2));
          NODE
