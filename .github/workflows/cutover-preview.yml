name: Cloud Shiyan preview settings diagnostic

on:
  push:
    branches: [ops/shiyan-cutover-preview]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Worker preview routing settings
        shell: bash
        run: |
          set -euo pipefail
          API='https://api.cloudflare.com/client/v4'
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/subdomain.json -w '%{http_code}' -H "$AUTH" \
            "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/mira-shiyan-api/subdomain")
          echo "http=${code}"
          test "$code" = '200'
          test "$(jq -r '.success' /tmp/subdomain.json)" = 'true'
          echo "workers_dev_enabled=$(jq -r '.result.enabled' /tmp/subdomain.json)"
          echo "previews_enabled=$(jq -r '.result.previews_enabled' /tmp/subdomain.json)"
