name: Cloud Shiyan cutover preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type upload-preview to upload a non-production Worker version'
        required: true
        type: string
  push:
    branches: [ops/shiyan-cutover-preview]

permissions:
  contents: read

concurrency:
  group: cloud-shiyan-cutover-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'upload-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Validate shared Cloudflare deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build non-production preview config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          fs.writeFileSync('wrangler.preview.json', JSON.stringify(config, null, 2));
          NODE

      - name: Require target runtime secrets before any upload
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx --yes wrangler@${WRANGLER_VERSION} secret list -c wrangler.preview.json)
          required=(
            DEVICE_AUTH_PEPPER
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            GITHUB_DESTINATION_TOKEN
            SHIYAN_LLM_CONFIG
          )
          missing=0
          for name in "${required[@]}"; do
            if grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output"; then
              echo "${name}=PRESENT"
            else
              echo "::error::${name}=MISSING on mira-shiyan-api"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source contracts before upload
        run: npm run typecheck && npm test

      - name: Dry-run effective preview config
        run: npx wrangler deploy --dry-run -c wrangler.preview.json

      - name: Upload version only — do not deploy production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --preview-alias shiyan-cutover -c wrangler.preview.json
          echo 'Version uploaded only. Production deployment and route traffic were not changed.'

      - name: Resolve aliased preview URL and smoke public boundary
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          code=$(curl -sS -o /tmp/subdomain.json -w '%{http_code}' -H "$AUTH" \
            "${API}/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")
          test "$code" = "200"
          test "$(jq -r '.success' /tmp/subdomain.json)" = "true"
          subdomain=$(jq -r '.result.subdomain // empty' /tmp/subdomain.json)
          test -n "$subdomain"
          preview="https://shiyan-cutover-mira-shiyan-api.${subdomain}.workers.dev"
          echo "Preview URL: ${preview}"

          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${preview}/health")
          test "$health_code" = "200"
          jq -e '.ok == true and .data.service == "mira-shiyan"' /tmp/health.json >/dev/null
          echo 'Preview /health=PASS'

          unauth_code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "${preview}/v1/capture-tasks")
          test "$unauth_code" = "401"
          jq -e '.ok == false and .error.code == "device_unauthorized"' /tmp/unauth.json >/dev/null
          echo 'Preview unauthenticated boundary=PASS'
