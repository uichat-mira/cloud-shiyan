name: Cloud Shiyan preview smoke diagnostic

on:
  push:
    branches: [ops/shiyan-cutover-preview]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect preview HTTP boundary
        shell: bash
        run: |
          set -u
          preview='https://shiyan-cutover-mira-shiyan-api.dangjingtao.workers.dev'
          echo "Preview URL: ${preview}"
          health_code=$(curl -sS -L -o /tmp/health.txt -w '%{http_code}' "${preview}/health" || true)
          echo "health_status=${health_code}"
          echo 'health_body:'
          head -c 1000 /tmp/health.txt 2>/dev/null || true
          echo
          unauth_code=$(curl -sS -L -o /tmp/unauth.txt -w '%{http_code}' "${preview}/v1/capture-tasks" || true)
          echo "unauth_status=${unauth_code}"
          echo 'unauth_body:'
          head -c 1000 /tmp/unauth.txt 2>/dev/null || true
          echo
