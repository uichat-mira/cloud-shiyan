name: Cloud Shiyan preview recreate and smoke

on:
  push:
    branches: [ops/shiyan-cutover-preview]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global npm@11

      - name: Build preview config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          fs.writeFileSync('wrangler.preview.json', JSON.stringify(config, null, 2));
          NODE

      - name: Verify required secrets
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx --yes wrangler@${WRANGLER_VERSION} secret list -c wrangler.preview.json)
          for name in DEVICE_AUTH_PEPPER R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY GITHUB_DESTINATION_TOKEN SHIYAN_LLM_CONFIG; do
            grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output" || { echo "::error::${name}=MISSING"; exit 1; }
          done

      - name: Validate source
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npx wrangler deploy --dry-run -c wrangler.preview.json

      - name: Upload enabled preview version only
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --preview-alias shiyan-cutover -c wrangler.preview.json | tee /tmp/upload.log
          grep -E 'Worker Version ID:' /tmp/upload.log || true
          echo 'No production deployment performed.'

      - name: Smoke preview
        shell: bash
        run: |
          set -euo pipefail
          preview='https://shiyan-cutover-mira-shiyan-api.dangjingtao.workers.dev'
          sleep 3
          health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${preview}/health")
          echo "health_status=${health_code}"
          test "$health_code" = '200'
          jq -e '.ok == true and .data.service == "mira-shiyan"' /tmp/health.json >/dev/null
          echo 'Preview /health=PASS'

          unauth_code=$(curl -sS -o /tmp/unauth.json -w '%{http_code}' "${preview}/v1/capture-tasks")
          echo "unauth_status=${unauth_code}"
          test "$unauth_code" = '401'
          jq -e '.ok == false and .error.code == "device_unauthorized"' /tmp/unauth.json >/dev/null
          echo 'Preview unauthenticated boundary=PASS'
