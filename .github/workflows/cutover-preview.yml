name: Cloud Shiyan cutover preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type upload-preview to upload a non-production Worker version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-shiyan-cutover-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm == 'upload-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared Cloudflare deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build non-production preview config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.preview_urls = true;
          fs.writeFileSync('/tmp/wrangler.preview.json', JSON.stringify(config, null, 2));
          NODE

      - name: Require target runtime secrets before any upload
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx --yes wrangler@${WRANGLER_VERSION} secret list -c /tmp/wrangler.preview.json)
          required=(
            DEVICE_AUTH_PEPPER
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            GITHUB_DESTINATION_TOKEN
            SHIYAN_LLM_CONFIG
          )
          missing=0
          for name in "${required[@]}"; do
            if grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output"; then
              echo "${name}=PRESENT"
            else
              echo "::error::${name}=MISSING on mira-shiyan-api"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source contracts before upload
        run: npm run typecheck && npm test

      - name: Dry-run effective preview config
        run: npx wrangler deploy --dry-run -c /tmp/wrangler.preview.json

      - name: Upload version only — do not deploy production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --preview-alias shiyan-cutover -c /tmp/wrangler.preview.json
          echo 'Version uploaded only. Production deployment and route traffic were not changed.'
