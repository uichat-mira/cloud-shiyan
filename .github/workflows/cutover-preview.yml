name: Cloud Shiyan cutover preview

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type upload-preview to upload a non-production Worker version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-shiyan-cutover-preview
  cancel-in-progress: false

jobs:
  preview:
    if: ${{ inputs.confirm == 'upload-preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_VERSION: '4.79.0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate shared Cloudflare deployment authority
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Build effective preview config from real legacy LLM plain-text settings
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"

          code=$(curl -sS -o /tmp/legacy-llm-settings.json -w '%{http_code}' \
            -H "$AUTH" \
            -H 'Content-Type: application/json' \
            "${API}/accounts/${ACCOUNT}/workers/scripts/mira-shiyan-llm/settings")
          test "$code" = "200"
          test "$(jq -r '.success' /tmp/legacy-llm-settings.json)" = "true"

          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          const settings = JSON.parse(fs.readFileSync('/tmp/legacy-llm-settings.json', 'utf8'));
          const bindings = settings.result?.bindings ?? [];
          const allowed = new Set([
            'LLM_PRIMARY_PROVIDER',
            'LLM_PRIMARY_BASE_URL',
            'LLM_PRIMARY_MODEL',
            'LLM_FALLBACK_PROVIDER',
            'LLM_FALLBACK_BASE_URL',
            'LLM_FALLBACK_MODEL',
            'LLM_TIMEOUT_MS',
            'LLM_MAX_TRANSCRIPT_CHARS',
          ]);
          config.vars ??= {};
          const copied = [];
          for (const binding of bindings) {
            if (binding?.type !== 'plain_text' || !allowed.has(binding.name)) continue;
            const value = binding.text ?? binding.value;
            if (typeof value !== 'string' || value.length === 0) continue;
            config.vars[binding.name] = value;
            copied.push(binding.name);
          }
          for (const required of ['LLM_PRIMARY_PROVIDER', 'LLM_PRIMARY_BASE_URL', 'LLM_PRIMARY_MODEL']) {
            if (!copied.includes(required)) throw new Error(`Legacy LLM setting missing: ${required}`);
          }
          config.preview_urls = true;
          fs.writeFileSync('/tmp/wrangler.preview.json', JSON.stringify(config, null, 2));
          console.log(`Copied ${copied.length} LLM plain-text setting name(s) without logging values.`);
          NODE

      - name: Require target runtime secrets before any upload
        shell: bash
        run: |
          set -euo pipefail
          output=$(npx --yes wrangler@${WRANGLER_VERSION} secret list -c /tmp/wrangler.preview.json)
          required=(
            DEVICE_AUTH_PEPPER
            R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY
            GITHUB_DESTINATION_TOKEN
            LLM_PRIMARY_API_KEY
          )
          missing=0
          for name in "${required[@]}"; do
            if grep -Eq "\"name\"[[:space:]]*:[[:space:]]*\"${name}\"" <<<"$output"; then
              echo "${name}=PRESENT"
            else
              echo "::error::${name}=MISSING on mira-shiyan-api"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source contracts before upload
        run: npm run typecheck && npm test

      - name: Dry-run effective preview config
        run: npx wrangler deploy --dry-run -c /tmp/wrangler.preview.json

      - name: Upload version only — do not deploy production traffic
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --preview-alias shiyan-cutover -c /tmp/wrangler.preview.json
          echo 'Version uploaded only. Production deployment and route traffic were not changed.'
